}



.card:hover{

}




.card a{


text-decoration:none;

color:white;

font-size:22px;


}



.icon{


font-size:40px;

margin-bottom:10px;


}




@keyframes fade{


from{

opacity:0;

transform:translateY(50px);

}


to{

opacity:1;

}


}
