.card{

width:250px;
background:#222;

border:2px solid gold;

border-radius:15px;

padding:20px;

text-align:center;

transition:.3s;

}


.card:hover{

transform:translateY(-10px);

}


.card a{

text-decoration:none;
color:white;

}


.image{

font-size:90px;

}



.rank{

background:#705400;

padding:8px;

border-radius:20px;

display:block;

}

.back-btn:visited{

padding:12px 25px;

background:#705400;

color:white;

text-decoration:none;

border:1px solid gold;

border-radius:25px;

transition:.3s;

}


.back-btn:hover{

background:#e8c46c;

color:black;

transform:translateX(-5px);

}
